name: Build Wiantex Native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        working-directory: native/WiantexApp
        run: dotnet restore WiantexApp.csproj -p:TargetFramework=net9.0-android

      - name: Publish APK
        working-directory: native/WiantexApp
        run: >-
          dotnet publish WiantexApp.csproj
          -f net9.0-android
          -c Release
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false
          --no-restore

      - name: Collect APK
        run: |
          mkdir -p artifacts/android
          find native/WiantexApp/bin/Release/net9.0-android -type f -name '*.apk' -exec cp {} artifacts/android/Wiantex.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wiantex-Android-APK
          path: artifacts/android/Wiantex.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Restore Windows target
        working-directory: native/WiantexApp
        run: dotnet restore WiantexApp.csproj -p:TargetFramework=net9.0-windows10.0.19041.0 -r win-x64 -p:EnableWindowsTargeting=true

      - name: Publish Windows x64
        working-directory: native/WiantexApp
        run: >-
          dotnet publish WiantexApp.csproj
          -f net9.0-windows10.0.19041.0
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          --no-restore

      - name: Collect Windows files
        shell: pwsh
        run: |
          $src = "native/WiantexApp/bin/Release/net9.0-windows10.0.19041.0/win-x64/publish"
          if (-not (Test-Path $src)) { throw "Publish output not found: $src" }
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          Copy-Item "$src/*" "artifacts/windows" -Recurse -Force

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/Wiantex-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wiantex-Windows-x64
          path: artifacts/Wiantex-Windows-x64.zip
          if-no-files-found: error
